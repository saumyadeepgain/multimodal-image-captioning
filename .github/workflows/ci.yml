name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "2"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.9"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }}, CPU)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python. setup-python has no 3.9 build for Ubuntu 26.04
          # (ubuntu-latest), so this entry runs on 24.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install CPU-only PyTorch
        # Installed first so the multi-GB CUDA wheels from PyPI are never pulled in.
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with test extras
        run: pip install -e ".[dev,tensorboard]"
      - name: Run tests
        run: >-
          pytest
          --cov=src --cov-report=term-missing --cov-report=xml
          --junitxml=pytest-report.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build CPU image (also resolves the pinned requirements on Python 3.12)
        run: docker build -t image-captioning:ci .
      - name: Smoke-test the CLIs inside the image
        run: |
          docker run --rm image-captioning:ci python -m src.train --help > /dev/null
          docker run --rm image-captioning:ci python -m src.evaluate --help > /dev/null
          docker run --rm image-captioning:ci python -m src.predict --help > /dev/null
