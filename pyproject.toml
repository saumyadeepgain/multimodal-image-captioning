[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-image-captioning"
version = "1.0.0"
description = "Image captioning with a ResNet-50 encoder and a Transformer decoder (Flickr8k)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "Pillow>=9.0",
    "numpy>=1.24",
    "nltk>=3.8",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
meteor = ["pycocoevalcap>=1.2"]
tensorboard = ["tensorboard>=2.14"]
wandb = ["wandb>=0.16"]
notebook = ["pandas>=2.0", "seaborn>=0.12", "wordcloud>=1.9", "jupyter"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff==0.16.9", "pycocoevalcap>=1.2"]

[project.scripts]
caption-train = "src.train:main"
caption-evaluate = "src.evaluate:main"
caption-predict = "src.predict:main"

[tool.setuptools]
packages = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning:wandb.*",
    "ignore::DeprecationWarning:tensorboard.*",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "NPY",  # NumPy-specific rules
    "RUF100",  # unused noqa directives
]
ignore = [
    "C408",  # dict(...) calls are clearer than literals for keyword-style configs
]

[tool.ruff.lint.per-file-ignores]
# Report generator: long prose strings for the PDF.
"docs/build_report.py" = ["E501"]
# Benchmark scripts: closures are timed immediately inside the loop (B023 is a false
# positive), sys.path is set up before importing the code under test (E402).
"docs/benchmark_*.py" = ["E501", "B023", "E402"]
"docs/ablation.py" = ["E501"]

[tool.ruff.lint.pyupgrade]
# Keep typing.Optional / Union: src/config.py resolves annotations at runtime with
# typing.get_type_hints, which cannot evaluate PEP 604 `X | None` on Python 3.9.
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
