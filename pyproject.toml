[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-image-captioning"
version = "0.4.0"
description = "Image captioning with a ResNet-50 encoder and a Transformer decoder (Flickr8k)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "Pillow>=9.0",
    "numpy>=1.24",
    "nltk>=3.8",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
meteor = ["pycocoevalcap>=1.2"]
tensorboard = ["tensorboard>=2.14"]
wandb = ["wandb>=0.16"]
notebook = ["pandas>=2.0", "seaborn>=0.12", "wordcloud>=1.9", "jupyter"]
dev = ["pytest>=7.4", "pycocoevalcap>=1.2"]

[project.scripts]
caption-train = "src.train:main"
caption-evaluate = "src.evaluate:main"
caption-predict = "src.predict:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
